<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Enfield | Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background-image:linear-gradient(rgba(0, 0, 0, 0.35),rgba(0, 0, 0, 0.35)),url("loginimg.jpg");
            background-size: cover;
            background-position: center;
        }

        .navbar {
            height: 90px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 50px;
            background-color: #111827;
        }

        .logo {
            color: white;
            font-size: 27px;
            font-weight: bold;
        }

        .admin {
            color: white;
            font-size: 18px;
            font-weight: bold;
        }

        .login-container {
            min-height: calc(100vh - 90px);
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding-left: 12%;
        }

        .login-box {
            width: 350px;
            background-color: #d4a017;
            border-radius: 15px;
            overflow: hidden;
            box-shadow:0 8px 25px rgba(0, 0, 0, 0.4);
        }

        .login-heading {
            padding: 25px 35px;
        }

        .login-heading h2 {
            color: white;
            font-size: 23px;
        }

        .login-form {
            padding: 30px 35px 25px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            color: #111827;
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        input {
            width: 100%;
            height: 42px;
            padding: 10px 13px;
            border: none;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
        }

        input:focus {
            box-shadow:0 0 0 2px #111827;
        }
        input::placeholder {
            color: #aaa;
        }
    
        .forgot-password {
            text-align: right;
            margin-top: -10px;
            margin-bottom: 15px;
        }

        .forgot-password a {
            color: white;
            text-decoration: none;
            font-size: 13px;
        }

        .forgot-password a:hover {
            text-decoration: underline;
        }

        .login-button {
            width: 100%;
            height: 42px;
            border: none;
            border-radius: 8px;
            background-color: white;
            color: #d4a017;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-button:hover {
            background-color: #111827;
            color: white;
        }

        .signup {
            text-align: center;
            margin-top: 22px;
            color: white;
            font-size: 14px;
        }

        .signup a {
            color: #111827;
            font-weight: bold;
            text-decoration: none;
        }

        .signup a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo">Royal Enfield</div>
    </nav>
    <div class="login-container">

        <div class="login-box">
            <div class="login-heading">
                <h2>Welcome <br> Login to your account</h2>
            </div>

            <form class="login-form">
                <div class="form-group">
                    <label for="email">E-mail ID</label>
                    <input type="email" id="email" placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required >
                </div>
                <div class="forgot-password">
                    <a href="#">Forgot password? </a>
                </div>

                <button type="submit" class="login-button">Login </button>
                <p class="signup">Don't have an account?<a href="signup.html">Sign up</a> </p>

            </form>
        </div>
    </div>
</body>
</html>
