<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Enfield | Signup</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background-image:linear-gradient(rgba(0, 0, 0, 0.35),rgba(0, 0, 0, 0.35)),url("signup.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        .navbar {
            height: 90px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 50px;
            background-color: #111827;
        }
        .logo {
            color: white;
            font-size: 27px;
            font-weight: bold;
        }
        .admin {
            color: white;
            font-size: 18px;
            font-weight: bold;
        }

        .signup-container {
            min-height: calc(100vh - 90px);
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 12%;
        }

        .signup-box {
            width: 350px;
            background-color: #d4a017;
            border-radius: 15px;
            overflow: hidden;
            box-shadow:0 8px 25px rgba(0, 0, 0, 0.4);
        }

        .signup-heading {
            padding: 25px 35px;
            
        }
        .signup-heading h2 {
            color: white;
            font-size: 23px;
        }

        .signup-form {
            padding: 30px 35px 25px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            color: #111827;
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        input {
            width: 100%;
            height: 42px;
            padding: 10px 13px;
            border: none;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
        }

        input:focus {
            box-shadow:0 0 0 2px #111827;
        }

        input::placeholder {
            color: #aaa;
        }

        .signup-button {
            width: 100%;
            height: 42px;
            border: none;
            border-radius: 8px;
            background-color: white;
            color: #d4a017;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        .signup-button:hover {
            background-color: #111827;
            color: white;
        }

        .signin {
            text-align: center;
            margin-top: 22px;
            color: white;
            font-size: 14px;
        }

        .signin a {
            color: #111827;
            font-weight: bold;
            text-decoration: none;
        }

        .signin a:hover {
            text-decoration: underline;
        }

    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo">Royal Enfield</div>
    </nav>
    <div class="signup-container">
        <div class="signup-box">
            <div class="signup-heading">
                <h2>Create Your Account</h2>
            </div>
            <form class="signup-form">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Enter your name" required >
                </div>
                <div class="form-group">
                    <label for="email">E-mail ID</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required >
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required >
                </div>
                <button type="submit"class="signup-button">Sign Up</button>
                <p class="signin"> Already have an account? <a href="login.html"> Sign in </a> </p>
            </form>

        </div>
    </div>
</body>
</html>
